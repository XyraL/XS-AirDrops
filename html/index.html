<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher-Airdrops</title>
    <!--
      Fonts are loaded from Google. FiveM's CEF has network access, so this
      works on any client with a connection — but a client without one falls
      back to the system stack in the CSS variables rather than failing.
      To make it fully offline, download the woff2 files into html/fonts/,
      swap this for @font-face rules, and add them to fxmanifest files{}.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="admin-overlay" class="hidden">
<div id="admin-wrapper">

    <!-- ── Sidebar ── -->
    <nav id="admin-sidebar">
        <div id="sidebar-logo">
            <div class="logo-mark">&#x2B21;</div>
            <div class="logo-text">CIPHER<span>DROPS</span></div>
        </div>

        <div id="sidebar-admin-badge"></div>

        <ul id="admin-nav">
            <li class="nav-item active" data-panel="live">
                <span class="nav-icon">&#9679;</span>
                <span class="nav-label">Live Drop</span>
                <span class="nav-badge" id="badge-live"></span>
            </li>
            <li class="nav-divider"></li>
            <li class="nav-item" data-panel="locations">
                <span class="nav-icon">&#9679;</span>
                <span class="nav-label">Locations</span>
                <span class="nav-badge" id="badge-locations"></span>
            </li>
            <li class="nav-item" data-panel="loot">
                <span class="nav-icon">&#9679;</span>
                <span class="nav-label">Loot Tables</span>
                <span class="nav-badge" id="badge-loot"></span>
            </li>
            <li class="nav-divider"></li>
            <li class="nav-item" data-panel="history">
                <span class="nav-icon">&#9679;</span>
                <span class="nav-label">History</span>
            </li>
            <li class="nav-item" data-panel="settings">
                <span class="nav-icon">&#9679;</span>
                <span class="nav-label">Settings</span>
                <span class="nav-badge" id="badge-settings"></span>
            </li>
        </ul>

        <div id="sidebar-footer">
            <button class="btn btn-ghost btn-sm" id="btn-close">Close</button>
        </div>
    </nav>

    <!-- ── Content ── -->
    <main id="admin-content">
        <div class="panel active" id="panel-live"></div>
        <div class="panel" id="panel-locations"></div>
        <div class="panel" id="panel-loot"></div>
        <div class="panel" id="panel-history"></div>
        <div class="panel" id="panel-settings"></div>
    </main>

</div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script src="js/core.js"></script>
<script src="js/panels/live.js"></script>
<script src="js/panels/locations.js"></script>
<script src="js/panels/loot.js"></script>
<script src="js/panels/history.js"></script>
<script src="js/panels/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
