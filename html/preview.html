<body>
<!--
  DEV-ONLY. Not listed in fxmanifest.lua's files{} block, so FiveM never serves
  it. It stubs the NUI bridge with sample data so the real css/js can be looked
  at in an ordinary browser, without a server running and without guessing at
  what the panel looks like.
-->

<div id="admin-overlay" class="hidden">
<div id="admin-wrapper">
    <nav id="admin-sidebar">
        <div id="sidebar-logo">
            <div class="logo-mark">&#x2B21;</div>
            <div class="logo-text">CIPHER<span>DROPS</span></div>
        </div>
        <div id="sidebar-admin-badge"></div>
        <ul id="admin-nav">
            <li class="nav-item active" data-panel="live"><span class="nav-icon">&#9679;</span><span class="nav-label">Live Drop</span><span class="nav-badge" id="badge-live"></span></li>
            <li class="nav-divider"></li>
            <li class="nav-item" data-panel="locations"><span class="nav-icon">&#9679;</span><span class="nav-label">Locations</span><span class="nav-badge" id="badge-locations"></span></li>
            <li class="nav-item" data-panel="loot"><span class="nav-icon">&#9679;</span><span class="nav-label">Loot Tables</span><span class="nav-badge" id="badge-loot"></span></li>
            <li class="nav-divider"></li>

            <li class="nav-item" data-panel="settings"><span class="nav-icon">&#9679;</span><span class="nav-label">Settings</span><span class="nav-badge" id="badge-settings"></span></li>
        </ul>
        <div id="sidebar-footer">
            <button class="btn btn-ghost btn-sm" id="btn-close">Close</button>
        </div>
    </nav>

    <main id="admin-content">
        <div class="panel" id="panel-live"></div>
        <div class="panel hidden" id="panel-locations"></div>
        <div class="panel hidden" id="panel-loot"></div>
        <div class="panel hidden" id="panel-history"></div>
        <div class="panel hidden" id="panel-settings"></div>
    </main>
</div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

    const endpoint = String(url).split('/').pop();

    return Promise.resolve({ json: () => Promise.resolve(body) });
